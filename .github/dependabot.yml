version: 2
updates:
  # Every action in our workflows is pinned by commit SHA with a version
  # comment; Dependabot moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # No gomod entry: CI installs no Go tools (so there is no tools/go.mod), and
  # the root module is left out on purpose, because ecosystem dependencies move
  # only to released versions, in the order the cascade tiers set.
